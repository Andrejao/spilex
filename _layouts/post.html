---
layout: default
---

<article class="post">

  <header class="post-header">
    <div class="container">

      <p class="eyebrow">
        {{ page.type | default: "Nyhed" }}
      </p>

      <h1>{{ page.title }}</h1>

      {% if page.teaser %}
        <p class="post-lead">
          {{ page.teaser }}
        </p>
      {% endif %}

    </div>
  </header>


  {% if page.image %}
  <div class="container post-image-wrap">
    <img
      class="post-image"
      src="{{ page.image | relative_url }}"
      alt="{{ page.title }}"
    >
  </div>
  {% endif %}


  <div class="container post-content">
    {{ content }}

    <div class="post-back">
      <a href="{{ '/nyheder.html' | relative_url }}">
        ← Se alle nyheder
      </a>
    </div>
  </div>

</article>
