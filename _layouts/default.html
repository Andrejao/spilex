<!DOCTYPE html>
<html lang="{{ site.lang | default: 'da' }}">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >
</head>

<body>

  <!-- Nedtælling -->
<div class="countdown-bar">
  <div class="container countdown-inner">

    <div class="countdown-message">

      <svg
        class="countdown-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="M7 2v3M17 2v3M3.5 9h17M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
        />
      </svg>

      <span>
        Viborg Brætspilsdag begynder om
        <strong><span id="days">--</span> dage</strong>,
        <strong><span id="hours">--</span> timer</strong>,
        <strong><span id="minutes">--</span> min</strong>
        og
        <strong><span id="seconds">--</span> sek.</strong>
      </span>

    </div>

    <a class="countdown-cta" href="#">
      Tilmeld dig nu!
    </a>

  </div>
</div>

  <!-- Navigation -->
  <header class="site-header">
    <div class="container nav">

      <a
        class="logo"
        href="{{ '/' | relative_url }}"
      >
        VIBORG BRÆTSPILSDAG
      </a>

      <nav>
        <a href="{{ '/program.html' | relative_url }}">
          Program
        </a>

        <a href="{{ '/aktiviteter.html' | relative_url }}">
          Aktiviteter
        </a>

        <a href="{{ '/#praktisk' | relative_url }}">
          Praktisk
        </a>
      </nav>

    </div>
  </header>


  <!-- Sidens indhold -->
  <main>
    {{ content }}
  </main>


  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">

      <strong>
        VIBORG BRÆTSPILSDAG
      </strong>

      <p>
        Brætspil, rollespil og fællesskab i Viborg.
      </p>

    </div>
  </footer>


<!-- Nedtælling -->
<script>
  const eventDate = new Date("2026-11-14T10:00:00+01:00");

  function updateCountdown() {
    const difference = eventDate - new Date();

    const countdownBar =
      document.querySelector(".countdown-bar");

    if (difference <= 0) {
      document.querySelector(".countdown-message span").innerHTML =
        "<strong>Viborg Brætspilsdag er i gang!</strong>";

      return;
    }

    const days = Math.floor(
      difference / (1000 * 60 * 60 * 24)
    );

    const hours = Math.floor(
      (difference / (1000 * 60 * 60)) % 24
    );

    const minutes = Math.floor(
      (difference / (1000 * 60)) % 60
    );

    const seconds = Math.floor(
      (difference / 1000) % 60
    );

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

</body>
</html>
