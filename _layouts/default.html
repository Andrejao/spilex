<!DOCTYPE html>
<html lang="{{ site.lang | default: 'da' }}">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} · {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.description | default: site.description }}"
  >

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >
</head>

<body>

  <!-- Nedtælling -->
  <div class="countdown-bar">
    <div class="container countdown-inner">

      <div class="countdown-label">
        <span class="countdown-dot"></span>
        Viborg Brætspilsdag begynder om
      </div>

      <div class="countdown" id="countdown">

        <div class="countdown-unit">
          <strong id="days">--</strong>
          <span>dage</span>
        </div>

        <div class="countdown-separator">:</div>

        <div class="countdown-unit">
          <strong id="hours">--</strong>
          <span>timer</span>
        </div>

        <div class="countdown-separator">:</div>

        <div class="countdown-unit">
          <strong id="minutes">--</strong>
          <span>min</span>
        </div>

        <div class="countdown-separator">:</div>

        <div class="countdown-unit">
          <strong id="seconds">--</strong>
          <span>sek</span>
        </div>

      </div>

    </div>
  </div>


  <!-- Navigation -->
  <header class="site-header">
    <div class="container nav">

      <a
        class="logo"
        href="{{ '/' | relative_url }}"
      >
        VIBORG BRÆTSPILSDAG
      </a>

      <nav>
        <a href="{{ '/program.html' | relative_url }}">
          Program
        </a>

        <a href="{{ '/aktiviteter.html' | relative_url }}">
          Aktiviteter
        </a>

        <a href="{{ '/#praktisk' | relative_url }}">
          Praktisk
        </a>
      </nav>

    </div>
  </header>


  <!-- Sidens indhold -->
  <main>
    {{ content }}
  </main>


  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">

      <strong>
        VIBORG BRÆTSPILSDAG
      </strong>

      <p>
        Brætspil, rollespil og fællesskab i Viborg.
      </p>

    </div>
  </footer>


  <!-- Nedtællingsscript -->
  <script>
    const eventDate =
      new Date("2026-11-14T10:00:00+01:00");

    function updateCountdown() {
      const now = new Date();
      const difference = eventDate - now;

      const countdown =
        document.getElementById("countdown");

      if (difference <= 0) {
        countdown.innerHTML = `
          <div class="countdown-live">
            Viborg Brætspilsdag er i gang!
          </div>
        `;

        return;
      }

      const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );

      const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );

      const seconds = Math.floor(
        (difference / 1000) % 60
      );

      document.getElementById("days").textContent =
        String(days);

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
    }

    updateCountdown();

    setInterval(updateCountdown, 1000);
  </script>

</body>
</html>
