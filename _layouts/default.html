      {{ site.title }}

  <meta name="description" content="{{ page.description | default: site.description }}">

    </a>
    
<nav>
  <a href="{{ '/program.html' | relative_url }}">Program</a>
  <a href="{{ '/aktiviteter.html' | relative_url }}">Aktiviteter</a>
  <a href="{{ '/#praktisk' | relative_url }}">Praktisk</a>

  </div>

</main>

<footer class="site-footer">
