- tid: "10.30–14.00"
  titel: "Lær solo-brætspil"
  vaert: "Thomas / The Lone Boardgamer"
  beskrivelse: "Oplev solobrætspil med hjælp fra Thomas. Der vil være forskellige spil at vælge mellem, og du behøver ikke kende dem på forhånd."
  image: "/assets/images/nyheder/solo-braetspil.jpg"
  image_alt: "Udvalg af solobrætspil klar til at blive prøvet"
  artikel: "/nyheder/solo-braetspil/"

- tid: "Hele dagen"
  titel: "Åbent brætspilsbibliotek"
  vaert: ""
  beskrivelse: "Gå på opdagelse blandt et par hundrede brætspil, lån et spil og find et ledigt bord. Vi hjælper gerne, hvis du ikke ved, hvad du skal vælge."
  image: "/assets/images/nyheder/braetspilsbibliotek.jpg"
  image_alt: "Mange forskellige brætspil samlet i et brætspilsbibliotek"
  artikel: "/nyheder/braetspilsbibliotek/"

- tid: "Fra 10.15"
  titel: "Brætspil for to personer"
  vaert: "Josias"
  beskrivelse: "Prøv stærke topersonersspil med hjælp fra Josias. Tag en ven med eller kom alene – så hjælper vi dig med at finde en at spille med."
  image: "/assets/images/nyheder/braetspil-for-to.jpg"
  image_alt: "To personer spiller et moderne brætspil over for hinanden"
  artikel: "/nyheder/braetspil-for-to/"

- tid: "12.00–14.00"
  titel: "STEW ORLEANS! Et dansk udviklet spil af Peter Langkjær Møller"
  vaert: "Peter Langkjær Møller"
  beskrivelse: "Mød spiludvikleren, prøv hans spil og kom tættere på processen bag et brætspil. Der vil også være en konkurrence med præmie."
  image: "/assets/images/nyheder/peter-langkjaer-moeller.jpg"
  image_alt: "Spiludvikling med prototypekomponenter på et bord"
  artikel: "/nyheder/peter-langkjaer-moeller/"

- tid: "14.00–16.00"
  titel: "Klar til Rumstratego?"
  vaert: "Krester"
  beskrivelse: "Prøv et brætspil under udvikling og oplev spiludvikling på tæt hold. Mere information følger."
