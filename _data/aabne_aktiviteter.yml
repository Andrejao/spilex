- tid: "10.30–15.00"
  titel: "Lær solo-brætspil"
  vaert: ""
  beskrivelse: "Prøv forskellige solo-brætspil og få hjælp til at komme i gang. Der vil være omkring 13–14 forskellige spil at vælge mellem."

- tid: "Hele dagen"
  titel: "Åbent brætspilsbibliotek"
  vaert: ""
  beskrivelse: "Lån et spil fra dagens brætspilsbibliotek og find et ledigt bord. Du behøver ikke tilmelde dig på forhånd."

- tid: "Fra 10.15"
  titel: "Brætspil for to personer"
  vaert: "Josias"
  beskrivelse: "Kom forbi og prøv brætspil, der fungerer særligt godt for to spillere."

- tid: "12.00–14.00"
  titel: "Peter Langkjær Møller præsenterer sit spil"
  vaert: "Peter Langkjær Møller"
  beskrivelse: "Mød spiludvikleren, prøv spillet og deltag i en konkurrence med præmie."

- tid: "14.00–16.00"
  titel: "Krester præsenterer sit brætspil"
  vaert: "Krester"
  beskrivelse: "Prøv et brætspil under udvikling og deltag i konkurrencer med præmier."
