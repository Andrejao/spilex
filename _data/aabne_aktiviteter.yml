- tid: "10.30–14.00"
  titel: "Lær solo-brætspil"
  vaert: "Thomas / The Lone Boardgamer"
  beskrivelse: "Oplev solobrætspil med hjælp fra Thomas. Der vil være forskellige spil at vælge mellem, og du behøver ikke kende dem på forhånd."
  image: "/assets/images/nyheder/solo-braetspil.jpg"
  image_alt: "Udvalg af solobrætspil klar til at blive prøvet"
  artikel: "/nyheder/solo-braetspil/"

- tid: "Fra 10.15"
  titel: "Brætspil for to personer"
  vaert: "Josias"
  beskrivelse: "Prøv stærke topersonersspil med hjælp fra Josias. Tag en ven med eller kom alene – så hjælper vi dig med at finde en at spille med."
  image: "/assets/images/nyheder/braetspil-for-to.jpg"
  image_alt: "To personer spiller et moderne brætspil over for hinanden"
  artikel: "/nyheder/braetspil-for-to/"

- tid: "12.00–14.00"
  titel: "STEW ORLEANS! Et dansk udviklet spil af Peter Langkjær Møller"
  vaert: "Peter Langkjær Møller"
  beskrivelse: "Mød spiludvikleren, prøv hans spil og kom tættere på processen bag et brætspil. Der vil også være en konkurrence med præmie."
  image: "/assets/images/nyheder/peter-langkjaer-moeller.jpg"
  image_alt: "Spiludvikling med prototypekomponenter på et bord"
  artikel: "/nyheder/peter-langkjaer-moeller/"

- tid: "14.00–16.00"
  titel: "Space Skirmish - prøv en tidlig prototype"
  vaert: "Kresten Kjær Sørensen"
  beskrivelse: "Prøv en tidlig prototype af det taktiske duelspil Space Skirmish, hvor to hold robotter kæmper om at ødelægge modstanderens landingsfartøj."
  image: "/assets/images/nyheder/space-skirmish.jpg"
  image_alt: "Prototype af Space Skirmish med robotter på et sekskantet spillebræt"
  artikel: "/nyheder/space-skirmish/"

- tid: "Hele dagen"
  titel: "Åbent brætspilsbibliotek"
  vaert: ""
  beskrivelse: "Gå på opdagelse blandt et par hundrede brætspil, lån et spil og find et ledigt bord. Vi hjælper gerne, hvis du ikke ved, hvad du skal vælge."
  image: "/assets/images/nyheder/bibliotek2.jpg"
  image_alt: "Mange forskellige brætspil samlet i et brætspilsbibliotek"
  artikel: "/nyheder/braetspilsbibliotek/"

- tid: "Tid kommer"
  titel: "Warhammer-showcase"
  vaert: "Mithril"
  beskrivelse: "Warhammer med figurer, terræn og spil på bordet. Kig forbi, se hobbyen på tæt hold og få en snak om både spil og miniaturer."
  image: "/assets/images/nyheder/warhammer-showcase.jpg"
  image_alt: "Warhammer-figurer og terræn opstillet på et spillebord"
  artikel: "/nyheder/warhammer-showcase/"

- tid: "Tid kommer"
  titel: "Star Wars: Legion"
  vaert: "Mithril"
  beskrivelse: "Se Star Wars: Legion i aktion med miniaturer, terræn og kampe på spillebordet. Du behøver ikke kende spillet på forhånd."
  image: "/assets/images/nyheder/star-wars-legion.jpg"
  image_alt: "Star Wars Legion-miniaturer og terræn opstillet på et spillebord"
  artikel: "/nyheder/star-wars-legion/"
  
- tid: "En del af dagen"
  titel: "Klubberne – aktiviteter for børn og unge"
  vaert: "Klubberne i Viborg"
  beskrivelse: "Klubberne kommer med blandt andet rollespil, figurmaling og andre spilaktiviteter. Der vil både være åbne aktiviteter og aktiviteter med faste tidspunkter. Viborg Brætspilsdag er primært for voksne; deltagere under 15 år skal være i følgeskab med en voksen under hele arrangementet."
  image: "/assets/images/nyheder/klubberne.jpg"
  image_alt: "Børn og unge deltager i rollespil og figurmaling sammen med voksne"
  artikel: "/nyheder/klubberne/"
