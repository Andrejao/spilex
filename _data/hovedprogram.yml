  beskrivelse: "Rugbrød, pålæg og grønt med videre som frokost-buffet. Det kræver særskilt tilmelding senest d. 7. november og koster 25 kroner (inkluderer fri kaffe og te resten af dagen). Betaling sker til MobilePay Box 0745GZ (husk navn)."

- tid: "18.00"
