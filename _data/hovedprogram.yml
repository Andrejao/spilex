- tid: "10.00"
  titel: "Dørene åbner"
  beskrivelse: "Kom bare indenfor."

- tid: "10.05"
  titel: "Velkomst"
  beskrivelse: "En kort velkomst og første lodtrækning."

- tid: "10.15"
  titel: "Aktiviteterne begynder"
  beskrivelse: "Åbne aktiviteter og aktiviteter med tilmelding går i gang."

- tid: "12.30 - 14.00"
  titel: "Frokost - er inkluderet"
  beskrivelse: "Rugbrød, pålæg og grønt med videre som frokost-buffet. Det er med i prisen for dagen, når du har købt billet."

- tid: "18.00"
  titel: "Aftensmad"
  beskrivelse: "Der laves en varm ret til aftensmad. Du koster 25 kroner, og du bestiller blot ved tilmelding og får en madbillet ved check-in på dagen."
  
- tid: "19.00 - 20.30"
  titel: "Klask-turnering"
  beskrivelse: "Husk at melde dig til via bookinglinket! Der er et begrænset antal pladser."

- tid: "20.30"
  titel: "Lodtrækning og præmier"
  beskrivelse: "Lodtrækning og uddeling af præmier til alle de heldige og vinderne."

- tid: "23.30"
  titel: "Brætspilsbiblioteket og aktiviteter rundes stille og roligt af"
  beskrivelse: "Den sidste runde spilles, vinderen findes og lånte spil afleveres tilbage."

- tid: "00.00"
  titel: "Viborg Brætspilsdag slutter"
  beskrivelse: "Tak for i dag."
